<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ColliClothes</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/login.js" defer></script>
</head>
<body>
    <header>
        <h1>ColliClothes</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="carrito.html">Carrito</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Iniciar sesión</h2>
            <p>Ingresa con el correo y la contraseña que registraste.</p>

            <form id="formulario-login" class="formulario-contacto" novalidate>
                <label for="correo-login">Correo</label>
                <input type="email" id="correo-login" name="correo-login" autocomplete="email" required aria-describedby="error-correo-login">
                <p id="error-correo-login" class="error" aria-live="polite"></p>

                <label for="password-login">Contraseña</label>
                <input type="password" id="password-login" name="password-login" autocomplete="current-password" required aria-describedby="error-password-login">
                <p id="error-password-login" class="error" aria-live="polite"></p>

                <button type="submit" id="ingresar" disabled>Ingresar</button>
                <p><a href="registro.html">Crear una cuenta nueva</a></p>
                <p id="resultado-login" role="status"></p>
                <noscript>Activa JavaScript para iniciar sesión.</noscript>
            </form>
        </section>
    </main>

    <footer>
        <p>ColliClothes - Ropa con identidad.</p>
    </footer>
</body>
</html>
